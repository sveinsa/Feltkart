name: Bygg Android-app (APK)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'index.html'
      - 'public/**'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write   # trengs for å legge APK-en ut som «Release»

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Les versjonsnummer fra src/version.ts
        id: ver
        run: |
          VER=$(grep -oP "VERSION = '\K[0-9.]+" src/version.ts)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Feltkart-versjon: $VER"

      - name: Installer og bygg webappen inn i Android-prosjektet
        run: |
          npm install
          npx vite build --outDir android/app/src/main/assets/www --emptyOutDir
        env:
          VITE_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_APP_ID: ${{ vars.GOOGLE_APP_ID }}
          # Valgfritt: Client ID av typen «Android» (se ANDROID.md). Kan også legges inn i appen under Felt → Oppsett.
          VITE_ANDROID_CLIENT_ID: ${{ vars.ANDROID_GOOGLE_CLIENT_ID }}

      - name: Hent signeringsnøkkelen
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Hemmeligheten KEYSTORE_B64 mangler. Se ANDROID.md, trinn 2 (Settings → Secrets and variables → Actions → New repository secret)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/feltkart.jks"

      - name: Bygg APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log"
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/feltkart.jks
          KEYSTORE_PASSWORD: feltkart-app
          KEY_ALIAS: feltkart
          KEY_PASSWORD: feltkart-app
          VERSION_CODE: ${{ github.run_number }}
          APP_VERSION: ${{ steps.ver.outputs.version }}

      # Hvis bygget feiler: samle feilmeldingene på ett sted (se «Summary»-siden og «Annotations» øverst på kjøringen)
      - name: Vis feilene tydelig
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/gradle.log"
          OUT="$RUNNER_TEMP/feil.txt"
          : > "$OUT"
          if [ -f "$LOG" ]; then
            grep -E '^e: ' "$LOG" | sed -E 's#^e: file://[^ ]*/work/[^/]+/[^/]+/##' | head -40 >> "$OUT" || true
            grep -E -A8 'What went wrong' "$LOG" | head -30 >> "$OUT" || true
          fi
          {
            echo "## Feil fra byggingen"
            echo '```'
            cat "$OUT"
            echo '```'
            echo "## Filer i android-mappen"
            echo '```'
            find android -type f \( -name '*.kt' -o -name '*.kts' -o -name 'AndroidManifest.xml' -o -name '*.xml' \) -not -path '*/assets/www/*' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do echo "::error::${line}"; done < <(head -15 "$OUT")

      - name: Gi APK-en et fast navn
        run: cp android/app/build/outputs/apk/release/app-release.apk Feltkart.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Feltkart-APK
          path: Feltkart.apk

      - name: Publiser som Release (fast nedlastingslenke)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest Feltkart.apk \
            --title "Feltkart for Android ${{ steps.ver.outputs.version }}" \
            --notes "Siste Android-app (Feltkart ${{ steps.ver.outputs.version }}, bygg ${{ github.run_number }}). Åpne denne siden på telefonen, last ned Feltkart.apk og installer. Se ANDROID.md for oppsett." \
            --target "${{ github.sha }}"
